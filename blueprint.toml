# LIBRETICA SANS
[ buildPlans.Libretica ]
	family = "Libretica Sans"
	spacing = "normal"
	noCvSs = true
	exportGlyphNames = false

	# VARIANTS
		[ buildPlans.Libretica.variants ]
			inherits = "ss02"

		# DESIGNS
		[ buildPlans.Libretica.variants.design ]

			# NUMBERS
		    one = "no-base-long-top-serif"
		    two = "curly-neck-serifless"
		    three = "two-arcs"
		    four = "closed-non-crossing-serifless"
		    five = "upright-flat-serifless"
		    six = "straight-bar"
		    seven = "curly-serifless"
		    eight = "two-circles"
		    nine = "straight-bar"
		    zero = "oval-dotted"

			# CAPITALS
		    capital-a = "curly-serifless"
		    capital-b = "more-asymmetric-serifless"
		    capital-c = "serifless"
		    capital-d = "more-rounded-serifless"
		    capital-e = "serifless"
		    capital-f = "serifless"
		    capital-g = "toothless-corner-serifless-hookless"
		    capital-h = "serifless"
		    capital-i = "serifless"
		    capital-j = "serifless"
		    capital-k = "symmetric-connected-serifless"
		    capital-l = "serifless"
		    capital-m = "hanging-serifless"
		    capital-n = "standard-serifless"
		    capital-p = "closed-serifless"
		    capital-q = "straight"
		    capital-r = "curly-serifless"
		    capital-s = "serifless"
		    capital-t = "serifless"
		    capital-u = "toothed-serifless"
		    capital-v = "curly-serifless"
		    capital-w = "curly-serifless"
		    capital-x = "curly-serifless"
		    capital-y = "curly-serifless"
		    capital-z = "curly-serifless"

			# LETTERS
		    a = "double-storey-serifless"
		    b = "toothed-serifless"
		    c = "serifless"
		    d = "toothed-serifless"
		    e = "flat-crossbar"
		    f = "flat-hook-serifless-crossbar-at-half-ascender-height"
		    g = "single-storey-serifless"
		    h = "straight-serifless"
		    i = "serifless"
		    j = "serifless"
		    k = "symmetric-connected-serifless"
		    l = "tailed"
		    m = "serifless"
		    n = "straight-serifless"
		    p = "eared-serifless"
		    q = "straight-serifless"
		    r = "hookless-serifless"
		    s = "serifless"
		    t = "flat-hook"
		    u = "toothed-serifless"
		    v = "curly-serifless"
		    w = "curly-serifless"
		    x = "curly-serifless"
		    y = "curly-serifless"
		    z = "curly-serifless"

			# SYMBOLS
		    capital-eszet = "corner-serifless"
		    long-s = "bent-hook-diagonal-tailed"
		    eszet = "traditional-diagonal-tailed-serifless"
		    lower-alpha = "barred"
		    lower-gamma = "curly"
		    capital-delta = "curly"
		    lower-delta = "rounded"
		    lower-iota = "tailed"
		    lower-kappa = "symmetric-connected-serifless"
		    capital-lambda = "curly-serifless"
		    lower-lambda = "curly"
		    lower-nu = "curly"
		    lower-chi = "curly-serifless"
		    partial-derivative = "straight-bar"

			# CYRLS
		    cyrl-a = "double-storey-serifless"
		    cyrl-capital-ze = "serifless"
		    cyrl-ze = "tall-serifless"
		    cyrl-capital-ka = "symmetric-connected-serifless"
		    cyrl-ka = "symmetric-connected-serifless"
		    cyrl-em = "hanging-serifless"
		    cyrl-capital-en = "serifless"
		    cyrl-en = "serifless"
		    cyrl-capital-er = "closed-serifless"
		    cyrl-er = "eared-serifless"
		    cyrl-capital-u = "curly-serifless"
		    cyrl-u = "curly-serifless"
		    cyrl-capital-ya = "curly-serifless"
		    cyrl-ya = "curly-serifless"

			# OTHERS
		    tittle = "round"
		    diacritic-dot = "round"
		    punctuation-dot = "round"
		    braille-dot = "round"
		    tilde = "low"
		    caret = "low"
		    ascii-grave = "straight"
		    ascii-single-quote = "straight"
		    paren = "normal"
		    brace = "straight"
		    at = "fourfold-solid-inner"
		    percent = "dots"
		    question = "corner"
		    pilcrow = "curved"
		    lig-ltgteq = "flat"

	# LIGATIONS
	[ buildPlans.Libretica.ligations ]
		inherits = "dlig"
		disables = [ "underscore-underscore" ]

	# OPTIONS
		# WEIGHTS
		[ buildPlans.Libretica.weights.Regular ]
			shape = 400
			menu = 400
			css = 400
		[ buildPlans.Libretica.weights.Bold ]
			shape = 700
			menu = 700
			css = 700
		[ buildPlans.Libretica.weights.Thin ]
			shape = 100
			menu = 100
			css = 100
		[ buildPlans.Libretica.weights.Light ]
			shape = 300
			menu = 300
			css = 300
		[ buildPlans.Libretica.weights.Heavy ]
			shape = 900
			menu = 900
			css = 900

		# WIDTHS
		[ buildPlans.Libretica.widths.Normal ]
			shape = 500
			menu = 5
			css = "normal"
		[ buildPlans.Libretica.widths.Extended ]
			shape = 600
			menu = 7
			css = "expanded"
		[ buildPlans.Libretica.widths.Condensed ]
			shape = 416
			menu = 3
			css = "condensed"
		[ buildPlans.Libretica.slopes.Upright ]
			angle = 0
			shape = "upright"
			menu = "upright"
			css = "normal"
		[ buildPlans.Libretica.slopes.Italic ]
			angle = 9
			shape = "italic"
			menu = "italic"
			css = "italic"


